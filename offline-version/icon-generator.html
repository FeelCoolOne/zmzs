<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社媒助手 - 图标生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .icon-preview {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .icon-item {
      text-align: center;
    }

    .icon-item canvas {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .icon-item label {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }

    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 30px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    button.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button.secondary {
      background: #f0f0f0;
      color: #333;
    }

    button.secondary:hover {
      background: #e0e0e0;
    }

    .info {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 16px;
      margin-top: 20px;
      border-radius: 4px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .info strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>社媒助手 - 图标生成器</h1>

    <div class="icon-preview">
      <div class="icon-item">
        <canvas id="icon16" width="16" height="16"></canvas>
        <label>16x16</label>
      </div>
      <div class="icon-item">
        <canvas id="icon32" width="32" height="32"></canvas>
        <label>32x32</label>
      </div>
      <div class="icon-item">
        <canvas id="icon48" width="48" height="48"></canvas>
        <label>48x48</label>
      </div>
      <div class="icon-item">
        <canvas id="icon128" width="128" height="128"></canvas>
        <label>128x128</label>
      </div>
    </div>

    <div class="button-group">
      <button class="primary" onclick="downloadAll()">下载所有图标</button>
      <button class="secondary" onclick="downloadIcon(16)">下载 16x16</button>
      <button class="secondary" onclick="downloadIcon(32)">下载 32x32</button>
      <button class="secondary" onclick="downloadIcon(48)">下载 48x48</button>
      <button class="secondary" onclick="downloadIcon(128)">下载 128x128</button>
    </div>

    <div class="info">
      <strong>使用说明：</strong><br>
      1. 点击"下载所有图标"按钮下载所有尺寸的图标<br>
      2. 将下载的图标文件放入 <code>offline-version/icon/</code> 目录<br>
      3. 文件名分别为：<code>icon16.png</code>, <code>icon32.png</code>, <code>icon48.png</code>, <code>icon128.png</code><br>
      4. 在 manifest.json 中取消注释图标配置<br><br>
      <strong>注意：</strong>图标使用渐变色背景（#667eea 到 #764ba2），中间是一个简化的房子图标，代表"采集"和"存储"的概念。
    </div>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';

      const padding = size * 0.2;
      const iconSize = size - padding * 2;

      ctx.beginPath();
      ctx.moveTo(padding + iconSize / 2, padding);
      ctx.lineTo(padding + iconSize, padding + iconSize * 0.4);
      ctx.lineTo(padding + iconSize, padding + iconSize);
      ctx.lineTo(padding, padding + iconSize);
      ctx.lineTo(padding, padding + iconSize * 0.4);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(102, 126, 234, 0.3)';
      ctx.fillRect(padding + iconSize * 0.3, padding + iconSize * 0.5, iconSize * 0.4, iconSize * 0.4);

      ctx.fillStyle = '#fff';
      ctx.fillRect(padding + iconSize * 0.4, padding + iconSize * 0.6, iconSize * 0.2, iconSize * 0.2);
    }

    function downloadIcon(size) {
      const canvas = document.getElementById('icon' + size);
      const link = document.createElement('a');
      link.download = 'icon' + size + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      [16, 32, 48, 128].forEach(size => {
        setTimeout(() => downloadIcon(size), size * 10);
      });
    }

    window.onload = function() {
      [16, 32, 48, 128].forEach(size => {
        const canvas = document.getElementById('icon' + size);
        drawIcon(canvas, size);
      });
    };
  </script>
</body>
</html>
