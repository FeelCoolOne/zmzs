<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社媒助手 - 设置</title>
  <link rel="stylesheet" href="styles/options.css">
</head>
<body>
  <div class="options-container">
    <header class="options-header">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <h1>社媒助手 - 设置</h1>
      </div>
      <div class="header-info">
        <span class="version">v1.0.0</span>
        <span class="separator">|</span>
        <span class="status">离线版</span>
      </div>
    </header>

    <main class="options-content">
      <section class="settings-section">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          基本设置
        </h2>

        <div class="setting-item">
          <div class="setting-label">
            <label for="autoExport">自动导出</label>
            <p class="setting-description">采集数据后自动导出到本地</p>
          </div>
          <div class="setting-control">
            <label class="switch">
              <input type="checkbox" id="autoExport">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-item">
          <div class="setting-label">
            <label for="exportFormat">导出格式</label>
            <p class="setting-description">选择默认的数据导出格式</p>
          </div>
          <div class="setting-control">
            <select id="exportFormat" class="select-input">
              <option value="json">JSON</option>
              <option value="csv">CSV</option>
              <option value="xlsx">XLSX</option>
            </select>
          </div>
        </div>

        <div class="setting-item">
          <div class="setting-label">
            <label for="downloadPath">下载路径</label>
            <p class="setting-description">媒体文件下载的默认路径</p>
          </div>
          <div class="setting-control">
            <input type="text" id="downloadPath" class="text-input" placeholder="社媒助手">
          </div>
        </div>

        <div class="setting-item">
          <div class="setting-label">
            <label for="maxFileSize">最大文件大小 (MB)</label>
            <p class="setting-description">限制下载的媒体文件大小</p>
          </div>
          <div class="setting-control">
            <input type="number" id="maxFileSize" class="number-input" min="1" max="500" value="50">
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          采集设置
        </h2>

        <div class="setting-item">
          <div class="setting-label">
            <label for="collectMode">采集模式</label>
            <p class="setting-description">选择数据采集的方式</p>
          </div>
          <div class="setting-control">
            <select id="collectMode" class="select-input">
              <option value="manual">手动采集</option>
              <option value="auto">自动采集</option>
              <option value="hybrid">混合模式</option>
            </select>
          </div>
        </div>

        <div class="setting-item">
          <div class="setting-label">
            <label for="collectInterval">采集间隔 (秒)</label>
            <p class="setting-description">自动采集的时间间隔</p>
          </div>
          <div class="setting-control">
            <input type="number" id="collectInterval" class="number-input" min="1" max="60" value="5">
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          数据管理
        </h2>

        <div class="data-stats">
          <div class="stat-item">
            <div class="stat-value" id="statCollected">0</div>
            <div class="stat-label">已采集</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statMedia">0</div>
            <div class="stat-label">媒体文件</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statDownloads">0</div>
            <div class="stat-label">下载次数</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statExports">0</div>
            <div class="stat-label">导出次数</div>
          </div>
        </div>

        <div class="action-buttons">
          <button id="exportAllBtn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            导出所有数据
          </button>
          <button id="clearAllBtn" class="btn btn-danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            清空所有数据
          </button>
        </div>
      </section>

      <section class="settings-section">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          关于
        </h2>

        <div class="about-info">
          <div class="info-item">
            <span class="info-label">版本</span>
            <span class="info-value">1.0.0</span>
          </div>
          <div class="info-item">
            <span class="info-label">类型</span>
            <span class="info-value">离线版</span>
          </div>
          <div class="info-item">
            <span class="info-label">支持平台</span>
            <span class="info-value">小红书、抖音、快手、TikTok、星图</span>
          </div>
          <div class="info-item">
            <span class="info-label">数据存储</span>
            <span class="info-value">本地 IndexedDB</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="options-footer">
      <button id="saveBtn" class="btn btn-success btn-large">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        保存设置
      </button>
    </footer>
  </div>

  <script src="lib/indexeddb.js"></script>
  <script src="scripts/options.js"></script>
</body>
</html>
